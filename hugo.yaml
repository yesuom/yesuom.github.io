baseURL: https://yesuom.github.io/
languageCode: en-us
title: Mousey'Log
theme: ["PaperMod"]

enableInlineShortcodes: true
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - $$
              - $$
            - - \\[
              - \\]
          inline:
            - - $
              - $
            - - \\(
              - \\)

params:
  env: production
  title: "Mousey Log"
  description: "Notes on Computational Neuroscience."
  author: "Yesuom"
  defaultTheme: auto
  
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  UseHugoToc: true
  
  homeInfoParams:
    Title: "Welcome to Mousey'Log 👋"
    Content: >
      Hi, this is Yesuom, a student interested in Computational Neuroscience, Psychology and AI, and I'm documenting my learning notes in this blog.
  
  socialIcons:
    - name: github
      url: "https://github.com/yesuom"
    - name: xiaohongshu
      url: "https://xhslink.com/m/cGmjvWgrHm"
    - name: bilibili
      url: "https://space.bilibili.com/102734966"

  assets:
    disableHLJS: false
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"